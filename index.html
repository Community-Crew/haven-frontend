<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Haven Community</title>
    <script>
      // Apply the theme before first paint. ThemeSwitcher isn't always mounted
      // (on mobile it only lives in the "More" menu), so it can't be the one to do this.
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      .boot-loader {
        position: fixed;
        inset: 0;
        margin: auto;
        width: 2rem;
        height: 2rem;
        border: 3px solid rgba(127, 127, 127, 0.25);
        border-top-color: rgba(127, 127, 127, 0.8);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Shown until Vue mounts (Keycloak + profile can take a few seconds); replaced on mount. -->
      <div class="boot-loader" role="status" aria-label="Loading"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
