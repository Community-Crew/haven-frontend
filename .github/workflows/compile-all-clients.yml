name: Compile All Clients (Web, Android, iOS)

on:
  push:
    branches: [ development ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------
  # 1. WEB CLIENT (Manual Download)
  # ----------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Compile Vue Web App
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-dist-package
          path: dist/

  # ----------------------------------------------------------------
  # 2. ANDROID CLIENT (.apk)
  # ----------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue Web App
        run: npm run build

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Android App (Debug APK)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk # Fixed: relative to working directory

  # ----------------------------------------------------------------
  # 3. iOS CLIENT (Xcode Build)
  # ----------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue Web App
        run: npm run build

      - name: Sync Capacitor Assets
        run: npx cap sync ios

      - name: Build Xcode Project
        working-directory: ./ios/App
        run: |
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     clean build