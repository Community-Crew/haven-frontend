name: Compile All Clients (Web, Android, iOS)

on:
  push:
    branches: [ development ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------
  # 1. WEB CLIENT (Manual Download)
  # ----------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Compile Vue Web App
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-dist-package
          path: dist/

  # ----------------------------------------------------------------
  # 2. ANDROID CLIENT (.apk)
  # ----------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue Web App
        run: npm run build

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Android App (Debug APK)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk # Fixed: relative to working directory

  # ----------------------------------------------------------------
  # 3. iOS CLIENT (Xcode Build)
  # ----------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue Web App
        run: npm run build

      - name: Sync Capacitor Assets
        run: npx cap sync ios

      - name: Build Xcode Project
        working-directory: ./ios/App
        run: |
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath ../../DerivedData \
                     clean build

      - name: Boot iOS Simulator
        # First boot on a fresh runner pays a one-time "Data Migration" cost
        # (locationd/FaceTime/iCloud Tabs/etc. migrator plugins) that alone
        # took ~5:30 in practice - keep real headroom above that.
        timeout-minutes: 12
        run: |
          set -euo pipefail

          echo "Available devices:"
          xcrun simctl list devices available

          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d['name'].startswith('iPhone'):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")

          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found on this runner"
            exit 1
          fi

          echo "Booting device $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install and launch app in Simulator
        timeout-minutes: 3
        run: |
          set -euo pipefail
          xcrun simctl install "$DEVICE_ID" DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --console "$DEVICE_ID" nl.havencommunity.portal > ios-boot-console.log 2>&1 &
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot ios-boot-screenshot.png

      - name: Test havenportal:// URL scheme registration
        timeout-minutes: 2
        run: |
          set -euo pipefail
          xcrun simctl openurl "$DEVICE_ID" "havenportal://authentication?code=test&state=test"
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot ios-deeplink-screenshot.png

      - name: Collect Simulator system log
        if: always()
        run: |
          xcrun simctl spawn "$DEVICE_ID" log show --predicate 'process == "App"' --style compact --last 3m > ios-system.log 2>&1 || true

      - name: Upload iOS Simulator test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-test
          path: |
            ios-boot-screenshot.png
            ios-deeplink-screenshot.png
            ios-boot-console.log
            ios-system.log